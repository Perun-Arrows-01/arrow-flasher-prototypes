<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arrow Flasher — Unified prototype</title>
  <style>
    :root {
      --bg-page: #010409;
      --bg-card: #0d1117;
      --bg-input: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --green: #238636;
      --green-soft: rgba(46,160,67,.14);
      --green-text: #7ee787;
      --red: #f85149;
      --red-soft: #3d1418;
      --red-text: #ffb4ab;
      --blue: #1f6feb;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg-page); color: var(--text); font-family: var(--sans); font-size: 14px; }
    .chrome { display: flex; flex-direction: column; height: 100%; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-card); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    header .subtitle { color: var(--muted); font-size: 12px; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    nav a { padding: 6px 12px; background: var(--bg-input); color: #fff; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; text-decoration: none; }
    nav a.active { background: var(--blue); border-color: var(--blue); }
    nav a.locked { color: var(--red-text); border-color: rgba(248,81,73,.42); }
    main { flex: 1; display: flex; overflow: hidden; }
    iframe { flex: 1; border: 0; width: 100%; height: 100%; background: var(--bg-page); }
    .notice { padding: 8px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
      /* P0 a11y: visible keyboard focus */
    :focus-visible { outline: 2px solid var(--blue, #1f6feb); outline-offset: 2px; }
    input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible { outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="chrome">
    <header>
      <h1>Arrow Flasher</h1>
      <span class="subtitle">Unified clickable prototype</span>
      <nav aria-label="Prototype navigation">
        <a href="#" data-target="dashboard.html" class="active">Dashboard</a>
        <a href="#" data-target="setup.html">Setup</a>
        <a href="#" data-target="history.html">History</a>
        <a href="#" data-target="rxbind.html">RX Bind</a>
        <a href="#" data-target="diag.html">Diagnostics</a>
        <a href="#" data-target="license.html" class="locked">License 🔒</a>
      </nav>
    </header>
    <div class="notice">License is temporarily locked in the prototype. All other screens match the real app controls.</div>
    <main>
      <iframe id="screen" src="dashboard.html"></iframe>
    </main>
  </div>

  <script>
    const iframe = document.getElementById('screen');
    document.querySelectorAll('nav a').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('nav a').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        iframe.src = link.dataset.target;
      });
    });
  </script>
</body>
</html>
